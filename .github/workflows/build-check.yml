# 台服 (TC) 建置檢查（TCToolbox）。Dalamud 釘在 API13 (dalamud-pin-v13.0.0.16)，外掛必須是 net9.0-windows7.0。
name: Build Check

on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            9.0.x
            10.x
        env:
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}/dotnet

      - name: Download Dalamud (TC pin)
        shell: pwsh
        run: |
          $pinUrl = 'https://github.com/ffxiv-tc-port/Dalamud/releases/download/dalamud-pin-v13.0.0.17/dalamud-api13-net9.zip'
          Invoke-WebRequest -Uri $pinUrl -OutFile dalamud-pinned.zip
          $sha = (Get-FileHash -Algorithm SHA256 -LiteralPath dalamud-pinned.zip).Hash
          if ($sha -ne '1481704F4DACBE96070F7B306FF1CE4BD77DB69C19CD74969FE296643E49EB5B') { throw "pinned Dalamud SHA256 mismatch: $sha" }
          Expand-Archive -Force dalamud-pinned.zip "$env:RUNNER_TEMP\dalamud-pinned\"

      - name: Restore Project
        run: dotnet restore TCToolbox/TCToolbox.csproj

      - name: Build Project
        run: dotnet build --configuration Release TCToolbox/TCToolbox.csproj -p:DalamudLibPath="$env:RUNNER_TEMP\dalamud-pinned\"
